<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book now</title>
  <style>
    :root { --line: #d0d4da; --muted: #5b6470; --bad: #b42318; --badbg: #fef3f2; --good: #067647; --goodbg: #ecfdf3; --warn: #93370d; --warnbg: #fffaeb; }
    * { box-sizing: border-box; }
    body { font: 14px/1.4 system-ui, sans-serif; max-width: 780px; margin: 0 auto; padding: .75rem 1rem; color: #1d2433; }
    h1 { font-size: 1.1rem; margin: 0 0 .5rem; display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
    h1 small { font-weight: 400; color: var(--muted); }
    h2 { margin: 0 0 .25rem; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    section { border: 1px solid var(--line); border-radius: 8px; padding: .6rem .75rem; }
    .big { font-weight: 600; }
    .price { font-size: 1.05rem; font-weight: 600; }
    .muted { color: var(--muted); font-size: .8rem; }
    .tag { display: inline-block; padding: 0 .4rem; border-radius: 4px; font-size: .75rem; font-weight: 600; }
    .tag.rfn { background: var(--goodbg); color: var(--good); }
    .tag.nrfn { background: var(--badbg); color: var(--bad); }
    .totalbar { display: flex; justify-content: space-between; align-items: baseline; margin: .6rem 0; padding: .5rem .75rem; background: #f3f4f6; border-radius: 8px; }
    .totalbar .price { font-size: 1.25rem; }
    form { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem .5rem; margin-bottom: .6rem; }
    label { font-size: .7rem; color: var(--muted); display: grid; gap: 2px; }
    label.wide { grid-column: span 2; }
    input, select { font: inherit; padding: .3rem .4rem; border: 1px solid var(--line); border-radius: 5px; width: 100%; }
    button { font: inherit; font-weight: 600; padding: .55rem 1.4rem; border-radius: 6px; border: 0; background: #1d4ed8; color: #fff; cursor: pointer; }
    button:disabled { background: #98a2b3; cursor: default; }
    button.accept { background: #b54708; }
    .actions { display: flex; gap: .75rem; align-items: center; }
    #result { margin-top: .6rem; }
    .box { border: 1px solid var(--line); border-radius: 8px; padding: .5rem .75rem; margin-bottom: .4rem; }
    .box.good { background: var(--goodbg); border-color: var(--good); }
    .box.bad { background: var(--badbg); border-color: var(--bad); }
    .box.warn { background: var(--warnbg); border-color: var(--warn); }
    .box p { margin: .15rem 0; }
    .demo { background: var(--warnbg); color: var(--warn); border: 1px dashed var(--warn); border-radius: 6px; padding: .2rem .5rem; font-size: .75rem; margin-bottom: .5rem; }
    @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } form { grid-template-columns: 1fr 1fr; } label.wide { grid-column: span 2; } }
  </style>
</head>
<body>
  <h1>Book now <small id="tripline"></small></h1>
  <div id="demo" class="demo" hidden></div>
  <div class="cards">
    <section><h2>Flight</h2><div id="flight">Loading…</div></section>
    <section><h2>Hotel</h2><div id="hotel">Loading…</div></section>
  </div>
  <div class="totalbar"><div><h2>Total</h2><div class="muted" id="expiry"></div></div><div class="price" id="total">—</div></div>
  <form id="traveller" autocomplete="off">
    <label>Title<select name="title"><option>mr</option><option>mrs</option><option>ms</option><option>miss</option></select></label>
    <label>Given name<input name="givenName" required></label>
    <label>Family name<input name="familyName" required></label>
    <label>Gender<select name="gender"><option value="m">m</option><option value="f">f</option></select></label>
    <label>Date of birth<input name="bornOn" type="date" required></label>
    <label class="wide">Email<input name="email" type="email" required></label>
    <label>Phone<input name="phoneNumber" required></label>
  </form>
  <div class="actions"><button id="book" disabled>Book now</button><span class="muted" id="hint"></span></div>
  <div id="result" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
